name: Daily Cafeteria Menu SlackBot

on:
  schedule:
    # `timezone` + cron: 월~금 08:07 America/Los_Angeles (IANA). 요일·시·분은 모두 LA 기준.
    # 목표 도착 창은 로컬 08:00~09:00. 08:07을 명목 시각으로 두어 지연 여유를 ~53분 확보.
    # GitHub schedule은 best-effort라 부하가 크면 밀림. 문서 권고대로 정시(:00)·반시(:30)
    # 같은 혼잡 슬롯을 피해 :07로 잡음. 이전 07:30(=14:30 UTC)은 2026-09 내내 3~5시간
    # 밀려서 로컬 10:45~12:30에 발송됐음.
    - cron: '7 8 * * 1-5'
      timezone: "America/Los_Angeles"

  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-menu-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # Scheduled workflows are auto-disabled by GitHub after 60 days without activity.
  # This re-enables itself via the API on each scheduled run to reset that clock.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1

  send-menu-to-slack:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # {date} in TARGET_URL is resolved with MENU_DATE_TZ (IANA), not the runner's UTC date.
      - name: 스크래핑 및 Slack 메시지 전송
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          MENU_DATE_TZ: America/Los_Angeles
        run: |
          python main.py
